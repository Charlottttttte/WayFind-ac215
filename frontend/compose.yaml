# Component preview only. Tavish owns the repository-wide integration workflow.
services:
  frontend:
    build: .
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-8080}:8080"
    environment:
      SEARCH_API_URL: ${SEARCH_API_URL:-http://host.docker.internal:8000/search}
    extra_hosts:
      - "host.docker.internal:host-gateway"
