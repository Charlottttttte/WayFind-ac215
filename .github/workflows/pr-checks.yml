name: PR checks

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main, 'milestone*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  javascript:
    name: JavaScript tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Test query mapping, response validation, and failure handling
        run: node --test frontend/tests/api.test.mjs

  python:
    name: Python and API tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Test local HTTP proxy and Vercel adapter
        run: python -m unittest discover -s frontend/tests -v

  container:
    name: Docker build and smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the frontend with frozen dependencies
        run: docker build --tag wayfind-frontend:ci frontend
      - name: Start the isolated test container
        run: >-
          docker run --detach --name wayfind-frontend-ci
          --publish 127.0.0.1:8080:8080
          --env SEARCH_API_URL=http://127.0.0.1:1/search
          wayfind-frontend:ci
      - name: Check startup, public assets, and backend-unavailable response
        shell: bash
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8080/health > /tmp/wayfind-health.json; then
              break
            fi
            sleep 1
          done
          python -c 'import json; assert json.load(open("/tmp/wayfind-health.json")) == {"status": "ok", "component": "frontend"}'
          for asset in / /style.css /app.js /api.mjs /mock.mjs; do
            curl --fail --silent --show-error "http://127.0.0.1:8080${asset}" --output /dev/null
          done
          status=$(curl --silent --show-error --output /tmp/wayfind-search.json --write-out '%{http_code}' \
            --header 'Content-Type: application/json' \
            --data '{"query":"interpretable machine learning","top_k":5}' \
            http://127.0.0.1:8080/search)
          test "$status" = '503'
          python -c 'import json; assert json.load(open("/tmp/wayfind-search.json")) == {"error": "Search service unavailable"}'
      - name: Show container logs
        if: always()
        run: docker logs wayfind-frontend-ci || true
      - name: Clean up the test container
        if: always()
        run: docker rm --force wayfind-frontend-ci || true

  backend:
    name: Backend retrieval tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install uv
        run: python -m pip install uv==0.12.10
      - name: Install locked dependencies
        run: uv sync --frozen
      - name: Test data loading, chunking, indexing, search, evaluation, and API
        run: uv run pytest --cov --cov-report=term-missing

  backend-container:
    name: Backend Docker build and retrieval smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the backend with frozen dependencies and the embedding model
        run: docker build --tag wayfind-backend:ci backend
      - name: Build the index from the test fixture with the real model
        run: >-
          docker run --rm --name wayfind-backend-indexer
          --volume "$PWD/backend/tests/fixtures:/data:ro" --volume wayfind-index:/index
          --env WAYFIND_DATA_PATH=/data/courses.csv
          wayfind-backend:ci /app/.venv/bin/python -m wayfind_retrieval.index
      - name: Start the API container
        run: >-
          docker run --detach --name wayfind-backend-ci
          --publish 127.0.0.1:8000:8000
          --volume "$PWD/backend/tests/fixtures:/data:ro" --volume wayfind-index:/index
          --env WAYFIND_DATA_PATH=/data/courses.csv
          wayfind-backend:ci
      - name: Check health, retrieval, validation, and no-match responses
        shell: bash
        run: |
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:8000/health > /tmp/backend-health.json; then
              break
            fi
            sleep 1
          done
          python -c 'import json; h = json.load(open("/tmp/backend-health.json")); assert h["status"] == "ok" and h["courses"] == 4, h'
          curl --fail --silent --show-error --header 'Content-Type: application/json' \
            --data '{"query":"Bayesian inference with priors and posteriors","top_k":3}' \
            http://127.0.0.1:8000/search > /tmp/backend-search.json
          python -c 'import json; r = json.load(open("/tmp/backend-search.json")); assert r["results"][0]["course_id"] == "TEST 101", r'
          status=$(curl --silent --output /dev/null --write-out '%{http_code}' --header 'Content-Type: application/json' \
            --data '{"query":"   "}' http://127.0.0.1:8000/search)
          test "$status" = '422'
          curl --fail --silent --show-error --header 'Content-Type: application/json' \
            --data '{"query":"asdkjh qwpoeiru zzxx"}' http://127.0.0.1:8000/search > /tmp/backend-nomatch.json
          python -c 'import json; assert json.load(open("/tmp/backend-nomatch.json"))["results"] == []'
      - name: Show container logs
        if: always()
        run: docker logs wayfind-backend-ci || true
      - name: Clean up the test container
        if: always()
        run: docker rm --force wayfind-backend-ci || true

  deploy:
    name: Deploy production to Vercel
    needs: [javascript, python, container, backend, backend-container]
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Check deployment configuration
        shell: bash
        run: |
          for variable in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [ -z "${!variable}" ]; then
              echo "::error::Missing GitHub Actions secret: ${variable}. See docs/ci.md."
              exit 1
            fi
          done
      - name: Check this is still the latest main commit
        id: latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')
          if [ "$latest" = "$GITHUB_SHA" ]; then
            echo 'deploy=true' >> "$GITHUB_OUTPUT"
          else
            echo 'deploy=false' >> "$GITHUB_OUTPUT"
            echo 'A newer main commit exists; its own successful CI run will deploy.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Build and deploy the tested commit
        if: steps.latest.outputs.deploy == 'true'
        run: >-
          npx --yes vercel@64.0.1 deploy --prod --yes
          --token "$VERCEL_TOKEN"
          > "$RUNNER_TEMP/wayfind-deployment-url.txt"
      - name: Verify production assets and API routing
        if: steps.latest.outputs.deploy == 'true'
        shell: bash
        run: |
          for asset in / /style.css /app.js /api.mjs /mock.mjs; do
            curl --fail --silent --show-error --retry 3 --retry-all-errors --max-time 30 \
              "https://wayfind-ac215.vercel.app${asset}" --output /dev/null
          done
          status=$(curl --silent --show-error --max-time 30 --output /dev/null --write-out '%{http_code}' \
            https://wayfind-ac215.vercel.app/api/search)
          test "$status" = '405'
          {
            echo "Deployed commit ${GITHUB_SHA} after all three CI checks passed."
            echo
            echo 'Production: https://wayfind-ac215.vercel.app'
            echo
            cat "$RUNNER_TEMP/wayfind-deployment-url.txt"
          } >> "$GITHUB_STEP_SUMMARY"
